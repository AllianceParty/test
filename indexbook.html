<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ebooks</title>
  <link rel="icon" href="logo.png" type="image/x-icon">
  <style>
    body {
      background-color: #121212;
      color: #00ff00;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      padding: 20px;
      border-bottom: 2px solid #00ff00; /* Wake Up Colour */
    }

    h1 {
      margin: 0;
      font-size: 2.5em;
    }

    .button-container {
      margin-top: 50px;
    }

    .download-btn {
      background-color: #1e1e1e;
      border: 2px solid #00ff00;
      color: #00ff00;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.2em;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
    }

    .download-btn:hover {
      background-color: #00ff00;
      color: #121212;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ebooks - NCERT Core</h1>
  </header>

  <div class="button-container">
    <a href="Six.zip" class="download-btn" download>Grade 6</a>
    <a href="Seven.zip" class="download-btn" download>Grade 7</a>
    <a href="Eight.zip" class="download-btn" download>Grade 8</a>
    <a href="Nine.zip" class="download-btn" download>Grade 9</a>
    <a href="Ten.zip" class="download-btn" download>Grade 10</a>
  </div>
</body>
</html>
